<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cyber OSINT & Phishing Analyzer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a1220;--p:#111c30;--p2:#16243d;--bd:#243656;--fg:#e4edfb;--mu:#8ea3c4;--cy:#22d3ee;--ok:#34d399;--wa:#fbbf24;--hi:#fb923c;--cr:#f87171}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3fa;--p:#fff;--p2:#f1f5fb;--bd:#cfd9e8;--fg:#0b1d3a;--mu:#51647f;--cy:#0891b2;--ok:#059669;--wa:#b45309;--hi:#c2410c;--cr:#dc2626}}
:root[data-theme="light"]{--bg:#eef3fa;--p:#fff;--p2:#f1f5fb;--bd:#cfd9e8;--fg:#0b1d3a;--mu:#51647f;--cy:#0891b2;--ok:#059669;--wa:#b45309;--hi:#c2410c;--cr:#dc2626}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--p);border-bottom:1px solid var(--bd);padding:8px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{flex:none;background:#fff;border-radius:10px;padding:3px;display:flex;align-items:center;justify-content:center}.logo img{height:68px;width:auto;display:block}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}.ttl{flex:1;text-align:center;min-width:0}.t1{font-size:clamp(15px,2.6vw,26px);font-weight:800;color:var(--cy);line-height:1.2}.t2{font-size:clamp(11px,1.5vw,14px);color:var(--mu);margin-top:3px}.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%;justify-content:space-between}@media(max-width:560px){.logo img{height:44px}.t2{display:none}}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav button{background:none;border:0;color:var(--mu);padding:7px 11px;border-radius:7px;cursor:pointer;font:inherit}nav button.on,nav button:hover{background:var(--p2);color:var(--cy)}
main{max-width:1100px;margin:0 auto;padding:16px}h1{margin:.2em 0;font-size:clamp(22px,4vw,34px);letter-spacing:.5px}h2{font-size:18px;margin:0 0 10px}.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--p);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{background:var(--cy);color:#04141c;border:0;border-radius:8px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}.btn.g{background:var(--p2);color:var(--fg);border:1px solid var(--bd)}
input[type=text]{width:100%;background:var(--p2);border:1px solid var(--bd);color:var(--fg);border-radius:8px;padding:10px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>input{flex:1 1 240px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.LOW,.FOUND{color:var(--ok)}.MEDIUM,.UNKNOWN{color:var(--wa)}.HIGH{color:var(--hi)}.CRITICAL{color:var(--cr)}.NF{color:var(--mu)}.RV{color:var(--cy)}
.demo{background:var(--wa);color:#111;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px}
.big{font-size:30px;font-weight:800}.mu{color:var(--mu)}.notice{border-left:4px solid var(--wa);background:var(--p2);padding:10px 12px;border-radius:6px;font-size:13px}
.steps div{padding:3px 0;color:var(--mu)}.steps div.d{color:var(--ok)}.steps div.d:before{content:"✓ "}.steps div:not(.d):before{content:"○ "}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600}.sc{overflow-x:auto}
.gauge{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--ok) 0 30%,var(--wa) 30% 60%,var(--hi) 60% 80%,var(--cr) 80%);position:relative;margin:10px 0}.gauge i{position:absolute;top:-5px;width:4px;height:24px;background:var(--fg);border-radius:2px}
.bar{height:10px;border-radius:5px;background:var(--cy);margin:4px 0}code{background:var(--p2);padding:2px 6px;border-radius:5px;word-break:break-all}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.flow span{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:13px}
label.ck{display:inline-flex;gap:5px;margin:3px 10px 3px 0;font-size:14px}
@media print{header,.noprint{display:none}body{background:#fff;color:#000}.card{border-color:#999}}
</style></head><body>
<header><div class="top"><div class="logo" id="l1"></div><div class="ttl"><div class="t1">AI-Powered OSINT &amp; Phishing Intelligence Platform</div><div class="t2">Investigate digital identities and detect suspicious URLs using intelligent cybersecurity analysis</div></div><div class="logo" id="l2"></div></div>

const BR=['paypal','google','microsoft','apple','amazon','facebook','instagram','netflix','sbi','hdfc','icici'],KW=['login','signin','verify','secure','security','account','update','confirm','banking','password','wallet'],TLD=['zip','top','xyz','tk','ml','ga','cf','gq','click','work','loan'];
function analyze(raw){let u;try{u=new URL(raw.trim())}catch(e){throw Error('Invalid URL. Include the protocol, e.g. https://example.com')}

if(u.protocol=='http:')add(15,'Not using HTTPS');if(ip)add(25,'IP address used instead of a domain name');if(raw.length>75)add(10,'Long URL ('+raw.length+' characters)');
if(raw.includes('@'))add(15,'"@" character in URL can hide the real destination');if(!ip&&L.length-2>=3)add(10,'Excessive subdomains ('+(L.length-2)+')');

const score=Math.min(100,fl.reduce((a,x)=>a+x[0],0));return {raw,host:h,proto:u.protocol.replace(':',''),fl,score,lvl:lvl(score),conf:fl.length?72:60,br,kws}}

const v4ok=s=>/^\d{1,3}(\.\d{1,3}){3}$/.test(s)&&s.split('.').every(x=>+x<=255&&String(+x)==x),ip2n=s=>s.split('.').reduce((a,x)=>a*256+ +x,0),n2ip=n=>[24,16,8,0].map(k=>(n>>>k)&255).join('.');

return `<h1>DNS Toolkit</h1><p class="sub">Lookup commands and email-spoofing posture check${dm()}</p>${note}<br><div class="card"><h2>1. Lookup command builder</h2><div class="row"><input type="text" id="ddm" value="${D?'example.com':''}" placeholder="domain" aria-label="Domain"><button class="btn" onclick="runD()">Build Commands</button></div><div id="err" class="CRITICAL"></div><div id="o1"></div></div>
<div class="card"><h2>2. SPF / DMARC analyzer</h2><p class="mu">Paste TXT records from dig or nslookup output.</p><textarea id="txt" rows="5" aria-label="TXT records">${esc(t)}</textarea><button class="btn" onclick="runE()">Analyze Records</button><div id="o2"></div></div>
<div class="card"><h2>3. Record types</h2><div class="sc"><table><tr><th>Type</th><th>Purpose</th><th>Why it matters</th></tr>${[['A / AAAA','Domain → IPv4 / IPv6','Check if many look-alike domains share one IP'],['MX','Mail servers','Unexpected MX can mean mail interception'],['NS','Authoritative name servers','Shows the DNS provider'],['TXT','SPF, DMARC, verification','Controls email spoofing protection'],['CNAME','Alias to another name','Dangling aliases enable takeover'],['PTR','IP → name (reverse)','Used in OSINT and mail reputation'],['SOA','Zone authority info','Serial and contact details']].map(x=>`<tr><td><code>${x[0]}</code></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div></div>`}
const dn=s=>s.trim().toLowerCase().replace(/^[a-z]+:\/\//,'').split(/[\/?#]/)[0].replace(/\.$/,''),dok=s=>/^([a-z0-9-]{1,63}\.)+[a-z0-9-]{2,63}$/.test(s)&&!/(^|\.)-|-(\.|$)/.test(s);
function runD(){const d=dn($('#ddm').value),e=$('#err');e.textContent='';if(!dok(d))return e.textContent='Invalid domain. Example: example.com';
const c=['dig +short A '+d,'dig +short AAAA '+d,'dig +short MX '+d,'dig +short NS '+d,'dig +short TXT '+d,'dig +short TXT _dmarc.'+d,'nslookup -type=TXT '+d,'whois '+d];mk('DNS',d,['Lookup commands generated for '+d]);$('#o1').innerHTML=cmdBox(c)+'<p class="mu">Paste the TXT results into analyzer 2 below.</p>'}
function runE(){const L=$('#txt').value.split('\n'),spf=L.find(l=>/v=spf1/i.test(l)),dm=L.find(l=>/v=DMARC1/i.test(l)),fl=[],ok=[];
if(!L.join('').trim())return $('#o2').innerHTML='<p class="CRITICAL">Paste at least one TXT record.</p>';
if(!spf)fl.push([30,'No SPF record found: the domain is easier to spoof']);else{if(/[+?]all/i.test(spf))fl.push([30,'SPF allows any sender (+all / ?all)']);else if(/~all/i.test(spf))fl.push([10,'SPF softfail (~all): spoofed mail may still be delivered']);else if(/-all/i.test(spf))ok.push('SPF ends with -all (strict)');else fl.push([10,'SPF has no "all" mechanism']);if((spf.match(/\b(include|exists|a|mx|ptr)(:|\s|$)/gi)||[]).length>10)fl.push([10,'More than 10 DNS-lookup mechanisms: SPF may fail']);if(/\bptr\b/i.test(spf))fl.push([5,'"ptr" mechanism is deprecated'])}
if(!dm)fl.push([30,'No DMARC record found']);else{const p=((dm.match(/\bp=(\w+)/i)||[])[1]||'').toLowerCase();if(p=='none')fl.push([15,'DMARC p=none: monitoring only, spoofed mail is not blocked']);else if(p=='quarantine'||p=='reject')ok.push('DMARC policy p='+p);else fl.push([15,'DMARC policy missing or unrecognised']);if(!/\brua=/i.test(dm))fl.push([5,'No rua= address for aggregate reports'])}
const s=Math.min(100,fl.reduce((a,x)=>a+x[0],0)),r=mk('DNS','SPF/DMARC analysis',[...fl.map(x=>'+'+x[0]+' '+x[1]),...ok],s);
$('#o2').innerHTML=`<h2 class="${lvl(s)}">Spoofing exposure: ${s}/100 (${lvl(s)})</h2><ul>${fl.map(x=>`<li>+${x[0]} ${x[1]}</li>`).join('')}${ok.map(x=>`<li class="FOUND">✓ ${x}</li>`).join('')}</ul><p class="mu">Observed from the pasted text only. Whether the records are live in DNS: unable to verify with the available evidence.</p><button class="btn" onclick="showRep('${r.id}')">Generate Investigation Report</button>`}

function domPg(){const b=D?'google.com\ng00gle-login.com\nxn--pypal-4ve.com\nsecure-paypa1-verify.top\nexample.com\nkq9x7vz2mw4t8b.xyz':'';
return `<h1>Domain Intelligence</h1><p class="sub">Heuristic domain risk, bulk triage and look-alike monitoring${dm()}</p>${note}<br><div class="card"><h2>1. Domain analyzer</h2><div class="row"><input type="text" id="dmi" value="${D?'paypa1-secure-login.top':''}" placeholder="domain" aria-label="Domain"><button class="btn" onclick="runDom()">Analyze Domain</button></div><div id="err" class="CRITICAL"></div><div id="o1"></div></div>
<div class="card"><h2>2. Bulk triage</h2><textarea id="bulk" rows="6" aria-label="Domains">${esc(b)}</textarea><button class="btn" onclick="runBulk()">Triage Domains</button><div id="o2"></div></div>
<div class="card"><h2>3. Look-alike (typosquat) generator</h2><p class="mu">For defensive brand monitoring. These are candidate strings only; registration status is not checked.</p><div class="row"><input type="text" id="tyb" value="${D?'rgmcet.edu.in':''}" placeholder="your domain" aria-label="Brand domain"><button class="btn" onclick="runTy()">Generate</button></div><div id="o3"></div></div>`}
function domScore(d){const L=d.split('.'),tld=L[L.length-1],sld=L[L.length-2],sub=L.length-2,fl=[],a=(p,m)=>fl.push([p,m]),nm=sld.replace(/1/g,'l').replace(/0/g,'o').replace(/3/g,'e').replace(/5/g,'s'),br=BR.find(b=>nm.includes(b)&&sld!==b),ty=!br&&BR.find(b=>b.length>=5&&sld!==b&&Math.abs(sld.length-b.length)<=2&&lev(sld,b)<=2);
if(d.includes('xn--'))a(20,'Punycode (possible look-alike characters)');if(TLD.includes(tld))a(10,'Suspicious TLD .'+tld);if(br)a(20,'Resembles brand "'+br+'" but is not the official domain');if(ty)a(20,'Within 2 edits of brand "'+ty+'" (typosquat pattern)');
if(sld.length>=12&&ent(sld)>3.3)a(15,'Random-looking name (entropy '+ent(sld).toFixed(2)+')');if((sld.match(/\d/g)||[]).length/sld.length>.3)a(10,'High share of digits');if((d.match(/-/g)||[]).length>=2)a(8,'Multiple hyphens');if(sub>=3)a(10,'Deep subdomain nesting ('+sub+')');if(d.length>30)a(8,'Long domain ('+d.length+' chars)');
const kw=KW.filter(k=>d.includes(k));if(kw.length)a(Math.min(10,kw.length*5),'Credential-style words: '+kw.join(', '));const s=Math.min(100,fl.reduce((x,y)=>x+y[0],0));return{fl,s,l:lvl(s)}}
function runDom(){const d=dn($('#dmi').value),e=$('#err');e.textContent='';if(!dok(d))return e.textContent='Invalid domain. Example: example.com';const r=domScore(d),m=mk('Domain',d,[...r.fl.map(x=>'+'+x[0]+' '+x[1]),'Local heuristics only; domain age and reputation not checked'],r.s);
$('#o1').innerHTML=`<div class="big ${r.l}">${r.s}/100 ${r.l}</div><div class="gauge"><i style="left:calc(${r.s}% - 2px)"></i></div><p>Registrable part: <code>${esc(d.split('.').slice(-2).join('.'))}</code> · Defanged: <code>${esc(defang(d))}</code></p>${r.fl.length?`<table>${r.fl.map(x=>`<tr><td>+${x[0]}</td><td>${esc(x[1])}</td></tr>`).join('')}</table>`:'<p>No indicators triggered.</p>'}<p class="mu">Domain age, registrar and reputation: unable to verify with the available evidence.</p>${cmdBox(['whois '+d,'dig +short NS '+d])}<button class="btn" onclick="showRep('${m.id}')">Generate Investigation Report</button>`}
function runBulk(){const L=[...new Set($('#bulk').value.split('\n').map(dn).filter(Boolean))].slice(0,50);if(!L.length)return $('#o2').innerHTML='<p class="CRITICAL">Enter one domain per line.</p>';
const R=L.map(d=>dok(d)?[d,domScore(d)]:[d,null]);$('#o2').innerHTML=`<div class="sc"><table><tr><th>Domain</th><th>Score</th><th>Level</th><th>Top reasons</th></tr>${R.map(([d,r])=>r?`<tr><td><code>${esc(defang(d))}</code></td><td>${r.s}</td><td><span class="tag ${r.l}">${r.l}</span></td><td>${esc(r.fl.slice(0,2).map(x=>x[1]).join('; ')||'None')}</td></tr>`:`<tr><td><code>${esc(d)}</code></td><td>-</td><td>Invalid</td><td></td></tr>`).join('')}</table></div>`;
mk('Domain','Bulk triage of '+L.length+' domains',R.map(([d,r])=>defang(d)+': '+(r?r.s+' '+r.l:'invalid')))}
function runTy(){const d=dn($('#tyb').value);if(!dok(d))return $('#o3').innerHTML='<p class="CRITICAL">Invalid domain. Example: mycollege.edu.in</p>';const L=d.split('.'),n=L[0],t=L.slice(1).join('.'),o=new Set();
for(let i=0;i<n.length;i++){o.add(n.slice(0,i)+n.slice(i+1));if(i<n.length-1)o.add(n.slice(0,i)+n[i+1]+n[i]+n.slice(i+2));o.add(n.slice(0,i)+n[i]+n[i]+n.slice(i+1))}
const hg={o:'0',l:'1',i:'l',e:'3',a:'4',s:'5'};for(const k in hg)if(n.includes(k))o.add(n.replace(k,hg[k]));if(n.includes('m'))o.add(n.replace('m','rn'));o.add(n+'-login');o.add('secure-'+n);
const r=[...o].filter(x=>x&&x!=n&&!x.startsWith('-')).map(x=>x+'.'+t);['com','net','org','in','co'].forEach(x=>{if(x!=t)r.push(n+'.'+x)});const v=r.slice(0,40);
$('#o3').innerHTML=`<p>${v.length} candidates for <code>${esc(d)}</code>. Consider monitoring or registering the likeliest ones:</p>${v.map(x=>`<span class="chip">${esc(defang(x))}</span>`).join('')}`;mk('Domain','Look-alikes for '+d,v.slice(0,12).map(defang))}

go('home');
</script></body></html>
